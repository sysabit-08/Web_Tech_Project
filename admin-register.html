<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
   
    <link rel="stylesheet" href="admin-register.css">
</head>
<body>

   
    <div class="fixed-top">
        AutoCare Admin Registration Portal
    </div>

    <form id="adminForm">
        <fieldset>
            <legend>Admin Registration</legend>

            <div>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName">
                <span id="nameError"></span>
            </div>

      
            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
                <span id="emailError"></span>
            </div>

           
            <div>
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone">
                <span id="phoneError"></span>
            </div>

            <div>
                <label>Gender:</label>
                <input type="radio" name="gender" value="Male" id="genderMale" checked>
                <label for="genderMale" style="display:inline;">Male</label>
                <input type="radio" name="gender" value="Female" id="genderFemale">
                <label for="genderFemale" style="display:inline;">Female</label>
            </div>

       
            <div>
                <label for="role">Admin Role:</label>
                <select id="role" name="role">
                    <option value="">--Select Role--</option>
                    <option value="Super Admin">Super Admin</option>
                    <option value="Service Manager">Service Manager</option>
                    <option value="Booking Supervisor">Booking Supervisor</option>
                </select>
                <span id="roleError"></span>
            </div>

           
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <span id="passwordError"></span>
            </div>

            <div>
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span id="confirmPasswordError"></span>
            </div>

            <div>
                <input type="checkbox" id="terms" name="terms">
                <label for="terms" style="display:inline;">I agree to the admin terms and policies</label>
                <span id="termsError"></span>
            </div>

            <button type="submit">Register Admin</button>
        </fieldset>
    </form>


    <script src="admin-register.js"></script>
</body>
</html>
